name: Build Ultraman FE3 Cooker PS2 Engine

on:
  push:
    branches: [engine-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || {
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          }

          echo "=== SDKMANAGER VERSION ==="
          "$SDKMANAGER" --version

          echo "=== API 37 PACKAGE AVAILABILITY ==="
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list |
            grep -E "platforms;android-37|build-tools;37|ndk;28.2|cmake;3.31" || true

          echo "=== END SDK PACKAGE CHECK ==="
          echo "Accepting SDK licenses using channel 3..."
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$LICENSE_STATUS" -eq 0 || {
            echo "SDK license acceptance failed: $LICENSE_STATUS"
            exit 1
          }

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.6"

      - name: Prepare ARMSX2 source and shader dependencies
        run: |
          chmod +x scripts/setup-armsx2.sh
          ./scripts/setup-armsx2.sh

      - name: Build single APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UltramanFE3-Cooker-PS2-Engine-ARM64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
